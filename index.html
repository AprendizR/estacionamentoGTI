<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estacionamento</title>
</head>

<body class="bg-blue-100 flex items-center justify-center">
  <div class="bg-blue-200 p-8 rounded-xl shadow-xl w-1/3">
    <!--o w-1/3 pega 1/3 da tela, nao tem bug quando clica no botão !-->
    <h1 class="text-2xl font-bold text-slate-800">🔑 Controle de Acesso</h1>
    <p class="text-slate-500 text-center p-6">Entre com suas credenciais</p>

    <!--formulário-->
    <form id="login-form">
      <label class="block text-slate-700 mt-4 mb-2 text-center">E-MAIL</label>
      <input type="email" id="email" required autofocus class="w-full border-slate-500 rounded-md p-2">

      <label class="block text-slate-700 mt-4 mb-2 text-center">SENHA</label>
      <input type="password" id="password" required class="w-full border-slate-500 rounded-md p-2">

      <button id="acessar" type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md mt-4 hover:bg-blue-700">
        Entrar
      </button>
    </form>
    <div id="message" class="mt-4 text-center text-sm text-red-500 bg-red-100 p-2 rounded-xl hidden"></div>

    <p class="mt-6 text-center text-sm text-slate-700">Não possui uma conta?
      <a href="./novo.html" class="font-semibold text-blue-600">Cadastrar usuário</a>
    </p>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
