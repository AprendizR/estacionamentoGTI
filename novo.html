<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Usuario | Estacionamento</title>
</head>

<body class="min-h-screen bg-blue-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-xl bg-blue-200 p-8 shadow-xl">
    <a href="./index.html" class="text-sm font-semibold text-blue-700 hover:text-blue-900">Voltar ao login</a>

    <h1 class="mt-4 text-center text-2xl font-bold text-slate-800">Cadastrar Usuario</h1>
    <p class="p-6 text-center text-slate-500">Informe os dados para criar sua conta</p>

    <form id="cadastro-form">
      <label class="mb-2 mt-4 block text-center text-slate-700">E-mail</label>
      <input type="email" id="email" required autofocus autocomplete="email"
        class="w-full rounded-md border border-slate-500 p-2">

      <label class="mb-2 mt-4 block text-center text-slate-700">Senha</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password"
        class="w-full rounded-md border border-slate-500 p-2">

      <label class="mb-2 mt-4 block text-center text-slate-700">Confirmar senha</label>
      <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password"
        class="w-full rounded-md border border-slate-500 p-2">

      <button id="cadastrar" type="submit" class="mt-4 w-full rounded-md bg-blue-600 py-2 text-white hover:bg-blue-700">
        Cadastrar
      </button>
    </form>

    <div id="message" class="mt-4 hidden rounded-xl p-2 text-center text-sm"></div>

    <p class="mt-6 text-center text-sm text-slate-700">
      Ja possui uma conta?
      <a href="./index.html" class="font-semibold text-blue-600 hover:text-blue-800">Entrar</a>
    </p>
  </div>

  <script type="module" src="/src/novo.js"></script>
</body>

</html>
