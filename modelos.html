<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelos | Estacionamento</title>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8">
    <header class="flex flex-col gap-4 rounded-lg border border-slate-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between">
      <div>
        <a href="menu.html" class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 transition hover:text-blue-700">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m12 19-7-7 7-7" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5" />
          </svg>
          Voltar ao menu
        </a>
        <h1 class="mt-3 text-2xl font-bold tracking-tight text-slate-950">Marcas e modelos</h1>
        <p class="mt-1 text-sm text-slate-500">Cadastre e mantenha os modelos de veículos do estacionamento.</p>
      </div>

      <button id="btn-logout" class="inline-flex items-center justify-center gap-2 rounded-md bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="m10 17 5-5-5-5" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3" />
        </svg>
        Sair
      </button>
    </header>

    <section class="grid gap-6 lg:grid-cols-[360px_1fr]">
      <form id="form-modelo" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <div class="mb-5 flex items-start justify-between gap-4">
          <div>
            <h2 id="form-titulo" class="text-lg font-semibold text-slate-950">Novo modelo</h2>
            <p id="form-subtitulo" class="mt-1 text-sm text-slate-500">Informe a marca e o modelo do veículo.</p>
          </div>
          <span id="form-modo" class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">Cadastro</span>
        </div>

        <input type="hidden" id="modelo-id" />

        <div class="space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700">Marca</span>
            <input id="marca" name="marca" type="text" required maxlength="80" autocomplete="off"
              class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              placeholder="Ex.: Honda" />
          </label>

          <label class="block">
            <span class="text-sm font-medium text-slate-700">Modelo</span>
            <input id="descricao" name="descricao" type="text" required maxlength="100" autocomplete="off"
              class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              placeholder="Ex.: Civic" />
          </label>
        </div>

        <p id="mensagem-form" class="mt-4 min-h-5 text-sm font-medium"></p>

        <div class="mt-5 flex flex-col gap-3 sm:flex-row">
          <button id="btn-salvar" type="submit" class="inline-flex flex-1 items-center justify-center gap-2 rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-8H7v8" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 3v5h8" />
            </svg>
            Salvar
          </button>

          <button id="btn-cancelar" type="button" class="inline-flex flex-1 items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 focus:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18" />
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 6 12 12" />
            </svg>
            Cancelar
          </button>
        </div>
      </form>

      <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <div class="flex flex-col gap-3 border-b border-slate-200 p-5 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h2 class="text-lg font-semibold text-slate-950">Registros cadastrados</h2>
            <p id="total-modelos" class="mt-1 text-sm text-slate-500">Carregando modelos...</p>
          </div>
          <button id="btn-recarregar" type="button" class="inline-flex items-center justify-center gap-2 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 focus:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 0 1-15 6.7L3 16" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 21v-5h5" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 1 15-6.7L21 8" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 8h5V3" />
            </svg>
            Atualizar
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full min-w-[640px] text-left text-sm">
            <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-5 py-3 font-semibold">Marca</th>
                <th class="px-5 py-3 font-semibold">Modelo</th>
                <th class="px-5 py-3 text-right font-semibold">Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-modelos" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/src/modelos.js"></script>
</body>

</html>
